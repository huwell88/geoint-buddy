# cixbuild 配置：1024 patch 版（输入 [1024,1536]，对应 512×512px）
# 用法：cixbuild build_1024.cfg
# 注意：calibration_data.npy 需为 [N,1024,1536] 形状，用 gen_calibration.py 生成
[Common]
mode = build
[Parser]
model_name = Qwen3-VL-4B-Instruct-1024
model_type = onnx
input_model = model_1024/vision.onnx
input = pixel_values
input_shape = [1024, 1536]
output_dir = ./out
[Optimizer]
dataset = numpydataset
cast_dtypes_for_lib=True
calibration_data = datasets/calibration_data_1024.npy
trigger_float_op = disable & <[LayerNorm, Softmax,Eltwise]:float16_preferred!>
weight_bits = 16
activation_bits = 16
bias_bits = 48
quantize_method_for_activation = per_tensor_asymmetric
quantize_method_for_weight = per_channel_symmetric_restricted_range
output_dir = ./out
[GBuilder]
target = X2_1204MP3
outputs = vision_1024.cix
tiling= fps
