<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>观澜 · 灾害应急遥感智能体</title>
<link rel="stylesheet" href="/vendor/maplibre-gl.css">
<link rel="stylesheet" href="/style.css?v=27">
</head>
<body>
<div id="app">
  <div id="map-wrap">
    <div id="map"></div>
    <div id="map-toolbar">
      <button id="btn-draw" title="圈选待核查区域">▢ 圈选区域</button>
      <button id="btn-clear-aoi" title="清除圈选">✕ 清除</button>
      <select id="basemap-sel" title="底图">
        <option value="offline">离线影像</option>
        <option value="esri">在线影像(Esri)</option>
        <option value="osm">在线街道(OSM)</option>
      </select>
      <select id="engine-sel" title="模型切换（云端 / 端侧引擎，切换前自动探测可用性）"></select>
      <button id="btn-compare" title="同一 AOI 双端侧引擎并行判读，结果分别落图对比">⇄ 双引擎对比</button>
    </div>
    <div id="aoi-hint">按住 Shift 并拖拽鼠标圈选待核查区域</div>
  </div>
  <div id="side">
    <header>
      <div class="brand">
        <svg class="logo" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="24" cy="24" r="21" stroke="#4d9de0" stroke-width="1.5" opacity="0.5"/>
          <circle cx="24" cy="24" r="21" stroke="#4d9de0" stroke-width="1.5" stroke-dasharray="20 112" stroke-linecap="round"/>
          <path d="M6 30 L16 16 L23 25 L30 13 L42 30" stroke="#7fb8e8" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
          <path d="M8 36 Q16 32 24 36 T40 36" stroke="#4d9de0" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <circle cx="24" cy="24" r="2.2" fill="#e8f2fb"/>
        </svg>
        <div class="brand-text">
          <h1>观澜</h1>
          <p class="brand-sub">GUANLAN · 端云协同灾害应急遥感智能体</p>
          <p class="brand-desc">滑坡 / 泥石流应急辅助研判 · 此芯 P1 国产边缘算力</p>
        </div>
      </div>
    </header>
    <div id="task-bar">
      <button id="btn-new-task" disabled>＋ 新建研判任务</button>
      <select id="task-list"><option value="">选择历史任务…</option></select>
      <button id="btn-report" title="将当前任务生成 Markdown 态势研判报告并下载">⤓ 导出报告</button>
    </div>
    <section id="agent-run" class="is-idle" aria-live="polite" hidden>
      <div class="run-head">
        <div class="run-title"><span class="run-beacon"></span><strong id="run-status">等待任务</strong></div>
        <span id="run-engine" class="run-engine">端侧引擎</span>
      </div>
      <div class="run-phases" aria-label="Agent 执行阶段">
        <div class="run-phase" data-phase="plan"><span>01</span><strong>任务规划</strong></div>
        <div class="run-phase" data-phase="tool"><span>02</span><strong>工具执行</strong></div>
        <div class="run-phase" data-phase="summary"><span>03</span><strong>证据汇总</strong></div>
        <div class="run-phase" data-phase="final"><span>04</span><strong>研判完成</strong></div>
      </div>
      <div class="run-tool">
        <span class="tool-mark" aria-hidden="true"></span>
        <div class="tool-copy">
          <span id="run-tool-kicker">当前节点</span>
          <strong id="run-tool-name">等待 Agent 启动</strong>
          <span id="run-tool-meta">发送研判任务后，这里将展示真实执行事件</span>
        </div>
        <span id="run-tool-state" class="tool-state">待命</span>
      </div>
      <div class="run-metrics">
        <div><strong id="run-rounds">—</strong><span>LLM 轮次</span></div>
        <div><strong id="run-tools">—</strong><span>工具结果</span></div>
        <div><strong id="run-artifacts">—</strong><span>证据产物</span></div>
      </div>
      <div id="run-gap" class="run-gap" hidden></div>
      <details id="run-details">
        <summary>执行明细 <span id="run-trace-count">0</span></summary>
        <div id="trace-log"></div>
      </details>
    </section>
    <div id="chat"></div>
    <div id="input-bar">
      <textarea id="msg-input" rows="1" placeholder="例：研判圈选区域滑坡风险，输出态势报告"></textarea>
      <button id="btn-send" disabled>发送</button>
    </div>
    <div id="panels">
      <div class="panel">
        <h3>图层 <button id="btn-refresh-layers" class="mini">刷新</button></h3>
        <ul id="layer-list"></ul>
      </div>
      <div class="panel">
        <h3>Token 用量</h3>
        <pre id="usage-box">—</pre>
      </div>
    </div>
  </div>
</div>
<script src="/vendor/maplibre-gl.js"></script>
<script src="/app.js?v=26"></script>
</body>
</html>
