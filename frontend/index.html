<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>观澜 · 灾害应急遥感智能体</title>
<link rel="stylesheet" href="/vendor/maplibre-gl.css">
<link rel="stylesheet" href="/style.css?v=17">
</head>
<body>
<div id="app">
  <div id="map-wrap">
    <div id="map"></div>
    <div id="map-toolbar">
      <button id="btn-draw" title="圈选待核查区域">▢ 圈选区域</button>
      <button id="btn-clear-aoi" title="清除圈选">✕ 清除</button>
      <select id="basemap-sel" title="底图">
        <option value="offline">离线影像</option>
        <option value="esri">在线影像(Esri)</option>
        <option value="osm">在线街道(OSM)</option>
      </select>
      <select id="engine-sel" title="端侧引擎（影响聊天与影像判读）"></select>
      <button id="btn-compare" title="同一 AOI 双端侧引擎并行判读，结果分别落图对比">⇄ 双引擎对比</button>
      <span id="net-badge" class="badge">ONLINE</span>
    </div>
    <div id="aoi-hint">按住 Shift 并拖拽鼠标圈选待核查区域</div>
  </div>
  <div id="side">
    <header>
      <div class="brand">
        <svg class="logo" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="24" cy="24" r="21" stroke="#4d9de0" stroke-width="1.5" opacity="0.5"/>
          <circle cx="24" cy="24" r="21" stroke="#4d9de0" stroke-width="1.5" stroke-dasharray="20 112" stroke-linecap="round"/>
          <path d="M6 30 L16 16 L23 25 L30 13 L42 30" stroke="#7fb8e8" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
          <path d="M8 36 Q16 32 24 36 T40 36" stroke="#4d9de0" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <circle cx="24" cy="24" r="2.2" fill="#e8f2fb"/>
        </svg>
        <div class="brand-text">
          <h1>观澜</h1>
          <p class="brand-sub">GUANLAN · 端云协同灾害应急遥感智能体</p>
          <p class="brand-desc">滑坡 / 泥石流应急辅助研判 · 此芯 P1 国产边缘算力</p>
        </div>
      </div>
    </header>
    <div id="task-bar">
      <button id="btn-new-task" disabled>＋ 新建研判任务</button>
      <select id="task-list"><option value="">选择历史任务…</option></select>
      <button id="btn-report" title="将当前任务生成 Markdown 态势研判报告并下载">⤓ 导出报告</button>
    </div>
    <div id="chat"></div>
    <div id="input-bar">
      <textarea id="msg-input" rows="2" placeholder="例：研判圈选区域滑坡风险，输出态势报告"></textarea>
      <button id="btn-send" disabled>发送</button>
    </div>
    <div id="panels">
      <div class="panel">
        <h3>图层 <button id="btn-refresh-layers" class="mini">刷新</button></h3>
        <ul id="layer-list"></ul>
      </div>
      <div class="panel">
        <h3>Token 用量</h3>
        <pre id="usage-box">—</pre>
      </div>
      <div class="panel">
        <h3>断网演练</h3>
        <div id="net-btns">
          <button data-net="ONLINE">在线</button>
          <button data-net="DEGRADED">弱网</button>
          <button data-net="OFFLINE">断网</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="/vendor/maplibre-gl.js"></script>
<script src="/app.js?v=19"></script>
</body>
</html>
